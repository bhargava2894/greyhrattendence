name: greytHR Attendance Automation

on:
  schedule:
    # Mon-Fri at 04:37 UTC (10:07 AM IST) - Sign In
    - cron: '37 4 * * 1-5'
    # Mon-Fri at 14:37 UTC (8:07 PM IST) - Sign Out
    - cron: '37 14 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (in/out)'
        required: true
        default: 'in'
        type: choice
        options:
          - in
          - out

jobs:
  attendance:
    name: Mark Attendance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium --with-deps

      - name: Determine Action
        id: determine-action
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_ACTION: ${{ github.event.inputs.action }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "37 4 * * 1-5" ]; then
              echo "ACTION=in" >> $GITHUB_ENV
              echo "Determined action: SIGN IN (scheduled)"
            else
              echo "ACTION=out" >> $GITHUB_ENV
              echo "Determined action: SIGN OUT (scheduled)"
            fi
          else
            echo "ACTION=$INPUT_ACTION" >> $GITHUB_ENV
            echo "Determined action: $INPUT_ACTION (manual)"
          fi

      - name: Run Attendance Script
        env:
          GREYTHR_USER: ${{ secrets.GREYTHR_USER }}
          GREYTHR_PASSWORD: ${{ secrets.GREYTHR_PASSWORD }}
          GREYTHR_URL: ${{ secrets.GREYTHR_URL || 'https://softility.greythr.com/' }}
          ACTION: ${{ env.ACTION }}
        run: |
          python greythr_attendance.py

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ env.ACTION }}-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

